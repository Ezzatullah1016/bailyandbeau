# /etc/nginx/sites-available/bailyandbeau
# Bailey & Beau — single instance serves:
#   1) IP-based access at https://<EC2 IP>/  (frontend + admin + api, self-signed cert)
#   2) https://api.reading-room.baileyandbeauco.com/  (backend API only, real LE cert)

# Port 80 — redirect every host to HTTPS so certbot HTTP-01 still works for any
# `server_name` entry below.
server {
    listen 80;
    server_name 16.16.146.231 51.21.140.88 api.reading-room.baileyandbeauco.com;
    return 301 https://$host$request_uri;
}

# IP-based vhost (default for any TLS request whose SNI doesn't match below).
# Keeps the bare-IP behaviour we already have today — frontend on /, API on /api etc.
server {
    listen 443 ssl default_server;
    server_name 16.16.146.231 51.21.140.88;
    client_max_body_size 50M;

    ssl_certificate     /etc/ssl/certs/bailyandbeau.crt;
    ssl_certificate_key /etc/ssl/private/bailyandbeau.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /static/ {
        alias /home/ubuntu/app/backend/staticfiles/;
    }
    location /media/ {
        alias /home/ubuntu/app/backend/media/;
    }

    location ~ ^/(api|admin|django-admin|staff|super-admin|webhooks)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 120;
    }
}

# API subdomain vhost — backend only. certbot --nginx will rewrite the
# `ssl_certificate` lines below to point at /etc/letsencrypt/live/...
server {
    listen 443 ssl;
    server_name api.reading-room.baileyandbeauco.com;
    client_max_body_size 50M;

    # Placeholder cert — replaced by certbot in the next step.
    ssl_certificate     /etc/ssl/certs/bailyandbeau.crt;
    ssl_certificate_key /etc/ssl/private/bailyandbeau.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /static/ {
        alias /home/ubuntu/app/backend/staticfiles/;
    }
    location /media/ {
        alias /home/ubuntu/app/backend/media/;
    }

    location ~ ^/(api|admin|django-admin|staff|super-admin|webhooks)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120;
    }

    # The API subdomain serves the API only — anything else gets 404.
    location / {
        return 404;
    }
}
