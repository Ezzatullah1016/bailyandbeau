# /etc/nginx/sites-available/baileybeau
# Symlink: /etc/nginx/sites-enabled/baileybeau
# After updating, run: sudo nginx -t && sudo systemctl reload nginx

upstream baileybeau_backend {
    server unix:/run/baileybeau-backend.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name 16.16.146.231 _;

    client_max_body_size 50M;

    # Django static and media (collected to these paths by deploy.sh)
    location /static/ {
        alias /opt/baileybeau/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /media/ {
        alias /opt/baileybeau/backend/media/;
        access_log off;
        expires 7d;
    }

    # Django (admin, super-admin, REST API)
    location ~ ^/(admin|super-admin|api|webhooks)(/|$) {
        proxy_pass http://baileybeau_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Next.js (everything else, including SSR + static chunks)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
