<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&amp;family=Newsreader:opsz,wght@6..72,400;6..72,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed": "#00210b",
                    "error-container": "#ffdad6",
                    "on-secondary-container": "#486a4e",
                    "secondary-fixed-dim": "#aad0ad",
                    "on-tertiary-container": "#432601",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#865047",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#350f0a",
                    "on-tertiary-fixed": "#2c1700",
                    "on-tertiary-fixed-variant": "#614018",
                    "surface-container": "#f0ede9",
                    "on-primary-fixed-variant": "#6b3931",
                    "tertiary-container": "#b88c5d",
                    "inverse-primary": "#fcb5aa",
                    "surface-container-low": "#f6f3ee",
                    "on-primary-container": "#4b201a",
                    "primary-fixed-dim": "#fcb5aa",
                    "secondary-container": "#c3e9c5",
                    "primary-fixed": "#ffdad4",
                    "surface-variant": "#e5e2dd",
                    "surface": "#fcf9f4",
                    "inverse-on-surface": "#f3f0eb",
                    "tertiary-fixed-dim": "#efbd8a",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#e5e2dd",
                    "surface-dim": "#dcdad5",
                    "surface-container-high": "#ebe8e3",
                    "on-surface-variant": "#524341",
                    "secondary-fixed": "#c6ecc8",
                    "on-surface": "#1c1c19",
                    "background": "#fcf9f4",
                    "tertiary": "#7c572d",
                    "surface-bright": "#fcf9f4",
                    "secondary": "#44664a",
                    "on-error-container": "#93000a",
                    "primary": "#865047",
                    "inverse-surface": "#31302d",
                    "outline": "#847370"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Newsreader", "serif"],
                    "body": ["Plus Jakarta Sans", "sans-serif"],
                    "label": ["Plus Jakarta Sans", "sans-serif"],
                    "serif": ["Cormorant Garamond", "serif"],
                    "jost": ["Jost", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FAF7F2;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- Account Creation Card -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-2xl p-10 shadow-[0_8px_40px_-12px_rgba(28,28,25,0.08)]">
<!-- Header / Identity -->
<div class="flex flex-col items-center mb-8">
<div class="text-2xl font-serif italic text-[#C4847A] mb-6">
                Bailey &amp; Beau
            </div>
<h1 class="font-headline text-3xl font-bold text-on-surface text-center mb-2">
                Create Your Account
            </h1>
<p class="font-jost text-[#8B7355] text-center">
                Start reading together in minutes.
            </p>
</div>
<!-- Registration Form -->
<form class="space-y-5" onsubmit="return false;">
<!-- Full Name -->
<div class="flex flex-col space-y-1.5">
<label class="font-jost text-sm font-medium text-on-surface-variant px-1">Full Name</label>
<input class="font-jost w-full px-4 py-3 rounded-lg bg-surface-container-high border-none ring-1 ring-inset ring-outline-variant/20 focus:ring-2 focus:ring-primary-container text-on-surface placeholder:text-outline/60 transition-all outline-none" placeholder="Your name" type="text"/>
</div>
<!-- Email Address -->
<div class="flex flex-col space-y-1.5">
<label class="font-jost text-sm font-medium text-on-surface-variant px-1">Email Address</label>
<input class="font-jost w-full px-4 py-3 rounded-lg bg-surface-container-high border-none ring-1 ring-inset ring-outline-variant/20 focus:ring-2 focus:ring-primary-container text-on-surface placeholder:text-outline/60 transition-all outline-none" placeholder="you@email.com" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col space-y-1.5">
<label class="font-jost text-sm font-medium text-on-surface-variant px-1">Password</label>
<div class="relative">
<input class="font-jost w-full px-4 py-3 rounded-lg bg-surface-container-high border-none ring-1 ring-inset ring-outline-variant/20 focus:ring-2 focus:ring-primary-container text-on-surface placeholder:text-outline/60 transition-all outline-none" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline/60 hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-4 mt-2 bg-[#C4847A] text-on-primary font-jost font-semibold rounded-lg hover:brightness-105 active:scale-[0.98] transition-all shadow-sm" type="submit">
                Create Account
            </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="px-3 bg-surface-container-lowest text-outline font-jost uppercase tracking-widest">or</span>
</div>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 py-3.5 border-2 border-[#7A9E7E] text-[#44664a] font-jost font-semibold rounded-lg hover:bg-secondary-container/10 active:scale-[0.98] transition-all" type="button">
<img alt="Google Logo" class="w-5 h-5" data-alt="Official Google icon with colored segments on a white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOKvg0V6RW7au06lgS4nL9DVP2daVGsVHPaatUIJl4dMqrDokzmcpfFRBDgqlBu2le6rpSiR73qGmFIuZ7NFEKsl6UympXv5Eb65_bWlr6snYo4KKXG_0WXmGx7O6fUcuNCAWsHQ9iPE5Ct33Ob8Wut0aXPCRdpBWxSAFJlDyrsQq7s_JtH6nodEz0Pwm3NoU0xg1WwyxG9zCGRhXBQK2QN11TbYeVReoCb1cTSdTDHmJ7ecWyNvUF4PQfXMlVtfWGr5UabJg4Pe03"/>
            Continue with Google
        </button>
<!-- Footer Link -->
<div class="mt-10 text-center font-jost text-sm text-on-surface-variant">
            Already have an account? 
            <a class="ml-1 text-[#C4847A] font-semibold hover:underline decoration-primary-container/30 underline-offset-4" href="#">Sign In</a>
</div>
</main>
<!-- Background Decoration (Subtle Heirloom Touches) -->
<div class="fixed -z-10 bottom-0 right-0 w-64 h-64 opacity-20 pointer-events-none">
<div class="w-full h-full bg-gradient-to-tl from-primary-container/20 to-transparent rounded-full blur-3xl"></div>
</div>
<div class="fixed -z-10 top-0 left-0 w-80 h-80 opacity-20 pointer-events-none">
<div class="w-full h-full bg-gradient-to-br from-secondary-container/20 to-transparent rounded-full blur-3xl"></div>
</div>
</body></html>
